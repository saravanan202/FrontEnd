<header class="header">
  <mat-toolbar style="background-color: rgb(29, 0, 158);">
    <div fxLayout="row" fxLayoutAlign="space-between center">
      <div fxLayout="row">
        <h2 style="margin-top: 5px; color: rgb(243, 243, 243);">SunTechie</h2>
      </div>
      <div fxHide fxShow.gt-xs fxLayout="row" fxLayoutAlign="end center" style="color: aliceblue; gap: 20px;">
        <button style="font-size: 15px;" mat-button routerLink="/home"><mat-icon>home</mat-icon>Home</button>
        <button style="font-size: 15px;" mat-button routerLink="/blog"><mat-icon>article</mat-icon>Blog</button>
        <button style="font-size: 15px;" mat-button routerLink="/contact"><mat-icon>mail</mat-icon>Contact</button>
        <button style="font-size: 15px;" mat-button routerLink="/empSp">Employee</button>

      </div>
      <div fxHide.gt-xs > 
        <div *ngIf="isMobile" >
        <div class="sidebar-opener" (click)="sidebarShow = !sidebarShow">
          <mat-icon>menu</mat-icon>
        </div>
    
        <div class="sidebar-slider" [class.sidebar-slide-in]="sidebarShow">
          <div class="sidebar-close" (click)="sidebarShow = !sidebarShow">
            <mat-icon>close</mat-icon>
          </div>
          <div class="sidebar-content">
            <button mat-button routerLink="/home">Home</button>
            <button mat-button routerLink="/blog">Blo g</button>
            <button mat-button routerLink="/contact">Contact</button>
            <button mat-button routerLink="/empSp">Employee</button>
            
          </div>
        </div>
        </div>
      </div>
    </div>
  </mat-toolbar>
</header>
