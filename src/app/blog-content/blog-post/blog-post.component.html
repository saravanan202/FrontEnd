<div style="min-height: 900px;">
<div class="container"  style="margin-top: 70px;">
    <button mat-button (click)="onSelect(0,true)" >Back</button>
    <mat-card style="box-shadow: none;flex-flow: wrap; display:flex;justify-content:center;">
      <mat-card style="box-shadow: none; max-width: 800px; min-width: 300px; ">
        <h2 class="heading-h" style="margin: 25px;margin-bottom: 10px;margin-right:1px">{{blogPost?.blogTitle}}</h2>
        <img mat-card-image [src]="getUrl(blogPost?.titleImage)"
          style="margin: 25px;max-height:400px; max-width: 800px; min-width: 200px; min-height:200px;border-radius: 3%;"
          alt="Photo">
        <mat-card-content>
          <div class="post-content">
            <p [innerHTML]="blogPost?.blogContent"></p><br>
            <img mat-card-image [src]="getUrl(blogPost?.imagePathOne)"
              style="max-height:400px;  width: 70%;"
              alt=" ">
            <img mat-card-image *ngIf="blogPost?.imagePathTwo" [src]="getUrl(blogPost?.imagePathTwo)"
              style="margin: 25px; width: 70%;"
              alt=" ">

            <p [innerHTML]="blogPost?.blogContentOne"></p><br>
            <img *ngIf="blogPost?.imagePathThree" mat-card-image [src]="getUrl(blogPost?.imagePathThree)"
              style="max-height:400px;  width: 70%;"
              alt=" ">

            <p [innerHTML]="blogPost?.blogContentTwo"></p><br>
            <img mat-card-image [src]="getUrl(blogPost?.imagePathFour)"
              style="max-height:400px;  width: 70%;"
              alt=" ">

            <p [innerHTML]="blogPost?.blogContentThree"></p><br>
            <img mat-card-image [src]="getUrl(blogPost?.imagePathFive)"
              style="max-height:500px;  width: 70%;"
              alt=" ">

            <p [innerHTML]="blogPost?.blogContentFour"></p><br>

            <p [innerHTML]="blogPost?.blogContentFive"></p><br>

            <p [innerHTML]="blogPost?.blogContentSix"></p><br>

            <p [innerHTML]="blogPost?.blogContentSeven"></p><br>

            <p [innerHTML]="blogPost?.blogContentEight"></p><br>

            <p [innerHTML]="blogPost?.blogContentEight"></p><br>

            <p [innerHTML]="blogPost?.blogContentNine"></p><br>

            <p [innerHTML]="blogPost?.conclusion"></p><br>


          </div>
        </mat-card-content>
      </mat-card>
      <mat-card style="justify-content:center; box-shadow: none;">
        <h2 class="heading-h" style="margin: 25px;margin-bottom: 0px;  font-size: 1.25rem;">Recent Article</h2>
        <mat-card class="example-card"  *ngFor="let blog of blogPosts"(click)="onSelect(blog.blogId,false)">
          <img mat-card-image style="max-height:150px; max-width: 400px;" [attr.src]="getUrl(blog.titleImage)"
            alt="title">
          <mat-card-content>
            <mat-card-title style="opacity: 0.8;">{{blog.blogTitle}}</mat-card-title>
          </mat-card-content>
        </mat-card>
      </mat-card>
    </mat-card>
  </div>
  </div>
